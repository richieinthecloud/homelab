# ---------------------------------------------------------------------------
# Bootstrap order (the chicken-and-egg part)
# ---------------------------------------------------------------------------
#
#   1. Install ArgoCD itself -- it can't deploy itself from a repo it isn't
#      running yet to watch:
#
#        kubectl create namespace argocd
#        kubectl apply -n argocd -f \
#          https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#
#   2. Get the initial admin password:
#
#        kubectl -n argocd get secret argocd-initial-admin-secret \
#          -o jsonpath='{.data.password}' | base64 -d
#
#   3. Reach the UI. Simplest first step is a port-forward from your laptop:
#
#        kubectl -n argocd port-forward svc/argocd-server 8080:443
#
#      (an Ingress for ArgoCD itself is a good follow-up task -- it needs
#      either --insecure on argocd-server or a Traefik TLS passthrough route,
#      which is a useful thing to have fought with once.)
#
#   4. Apply this file:
#
#        kubectl apply -f clusters/homelab/argocd-bootstrap.yaml
#
#   5. In the UI, sync `homelab-bootstrap`.
#
# This repo is public, so ArgoCD needs no credentials to read it. If you ever
# want to make your clone private, register a deploy key or PAT under Settings -> Repositories.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/richieinthecloud/homelab
    targetRevision: main
    path: infra/argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd # Application objects live alongside ArgoCD itself

  syncPolicy:
    automated: # Delete Applications that are removed from our code.
      # this Application manages other Applications that are highlighted in infra/argocd/applications/kustomization.yaml
      # deleting Applications from there will lead cause it to be dropped from the cluster. The repo is now the single source of truth
      # must be very careful to not take anything offline
      prune: true
      # Revert any and every change not made within the repo
      selfHeal: true
      # Refuse to sync if the rendered output is empty. Cheap insurance against a bad commit or a broken kustomization pruning the whole cluster
      allowEmpty: false
    
    retry: 
      # automated syncs happen unattended, so a transient failure (node reboot, registry hiccup)
      # should back off and retry rather than just sitting in a failed state
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

    syncOptions:
      - CreateNamespace=false # argocd namespace already exists by step 1