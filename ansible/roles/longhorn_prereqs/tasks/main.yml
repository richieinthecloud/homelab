# Everything Longhorn needs on the host before its first sync.
# Mirrors the checklist in infra/argocd/applications/longhorn-app.yaml

- name: Install Longhorn host dependencies
  ansible.builtin.apt:
    name: 
      - open-iscsi # iSCSI initiator: how Longhorn attaches volumes to a node
      - nfs-common # needed for RWX volumes and backups to NFS 
    state: present
    update_cache: true
    cache_valid_time: 86400 # skip 'apt update' if the cache is less than 24 hrs old

- name: Enable and start iscsid
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started

- name: Keep multipathd away from plain sd* disks
# multipathd grabs block devices it thinks are multipath, including the 
# ones Longhorn creates, and mounts then fail with "already in use".
  ansible.builtin.copy:
    src: multipath.conf
    dest: /etc/multipath.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload multipathd