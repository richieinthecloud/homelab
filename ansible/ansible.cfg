# Ansible only reads this file when you run commands from inside ansible/
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# readable task output instead of one-line JSON
callback_result_format = yaml
# group_vars/all/vault.yml is encrypted; prompt for its password once per run
ask_vault_pass = True

[privilege_escalation]
# sudo on the nodes requires a password. Prompt for it once per run
# instead of storing it anywhere.
become_ask_pass = True