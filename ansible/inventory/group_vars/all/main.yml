# These are variables shared by every host
# k3s release this cluster runs. Roles check against it; they never upgrade. 
k3s_version: "v1.36.4+k3s1"

# The real value is encrypted in vault.yml. Pointing at it from here means
# you can see where k3s_token comes from without decrypting it.
k3s_token: "{{ vault_k3s_token }}"

# Traefik dashboard login: one htpasswd line from 'htpassword -nB admin'.
# A bcrypt hash, never the password itself. The real value is encrypted in vault.yml.
traefik_dashboard_htpasswd: "{{ vault_traefik_dashboard_htpasswd }}"