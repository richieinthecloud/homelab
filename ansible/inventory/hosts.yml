# HostNames only. Each one resolves through a custom config file on the machines
# running in the cluster. This holds IP, and the per-node keys. No addresses or 
# key paths belong in this public repo
all: 
  vars:
    ansible_user: richiealvarezadmin
    ansible_python_interpreter: /usr/bin/python3

  children:
    k3s_server:
      hosts:
        ubuntu-dell-7430
    
    k3s_agent:
      hosts:
        ubuntu-macbook-pro:
        ubuntu-optiplex:

    # Groups describe what a host IS; a host can be in several groups.
    laptops: # run lid-closed. I will be replacing these with towers/desktops in the coming weeks
      hosts:
        ubuntu-dell-7430:
        ubuntu-macbook-pro:

    longhorn_storage: # hold Longhorn replicas (create-default-disk=true)
      hosts:
        ubuntu-macbook-pro:
        ubuntu-optiplex: