# Copies the cluster's admin kubeconfig from the control-plane node onto the
# Fedora workstation node so that kubectl works from here without sudo or ssh

#   ansible-playbook playbooks/fetch-kubeconfig.yml

# The result is the cluster-admin access. It lands in ~/.kube/config with mode 0600

- name: Fetch the cluster kubeconfig to this workstation
  hosts: k3s_server
  become: true
  gather_facts: true # needed for the server's IP (ansible_default_ipv4)
  vars:
    kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config"

  tasks: 
    - name: Read k3s.yaml from the control-plane
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true # contents are credentials; keep them out of the output

    - name: Make sure ~/.kube exists on this workstation
      ansible.builtin.file:
        path: "{{ kubeconfig_dest | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false # local task: no sudo on Fedora

    - name: Write the kubeconfig, pointed at the server instead of localhost
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
            | replace('https://127.0.0.1:6443',
                      'https://' ~ ansible_default_ipv4.address ~ ':6443') }}
        dest: "{{ kubeconfig_dest }}"
        mode: "0600"
      delegate_to: localhost
      become: false # local task: no sudo on Fedora
      no_log: true # contents are credentials; keep them out of the output