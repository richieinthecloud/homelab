# Homepage: a dashboard at http://homepage.homelab.local with a tile per app in
# the cluster. Apps add themselves by carrying gethomepage.dev/* annotations on
# their Ingress, so nothing here or in apps/homepage changes when an app is added.
# Same shape as galaga-app.yaml: manifests in apps/homepage, the Application here.

# Before the first sync:
# 1. Add homepage.homelab.local to the hosts file on the machine you browse from,
#    pointing at the HP's IP (same as galaga.homelab.local and grafana.homelab.local).
# Nothing else: no Secret, no node prep.

# Logs: Grafana -> Explore -> Loki:  {namespace="homepage"}
# If the page won't load, reach the pod directly, skipping Traefik and the hosts file:
#    kubectl -n homepage port-forward svc/homepage 3000
#    -> http://localhost:3000

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  finalizers:
    # Deleting this Application removes homepage too, ClusterRole included.
    # Safe: it holds no data, every byte of its config is in git.
    - resources-finalizer.argocd.argoproj.io
spec:
  # 'default' allows cluster-scoped objects, which this app needs (ClusterRole and
  # ClusterRoleBinding). If projects are ever tightened, homepage breaks first:
  # it needs both kinds in the project's clusterResourceWhitelist.
  project: default

  source:
    repoURL: https://github.com/richieinthecloud/homelab
    targetRevision: main
    path: apps/homepage # kustomization.yaml in here is the entrypoint

  destination:
    server: https://kubernetes.default.svc
    namespace: homepage

  syncPolicy:
    automated:
      # Also what cleans up the previous homepage-config-<hash> ConfigMap after
      # each config change (see apps/homepage/kustomization.yaml).
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true # belt-and-braces; namespace.yaml also creates it
