# Blackbox exporter: tests things from the outside, the way a user would, and reports
# whether they answered. Prometheus asks it to probe a URL ("is galaga up?") and it
# returns success, HTTP status code and how long each step took.

# Same shape as longhorn-app.yaml and monitoring-app.yaml: the chart is pulled by
# ArgoCD and rendered with the values below. What gets probed is NOT configured here.
# Targets are Probe resources under apps/monitoring/probes/, so adding a site to watch
# never touches this file.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  finalizers:
    # Deleting this Application removes the exporter too. Safe: it holds no data.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 11.20.0 # blackbox_exporter v0.29.0
    helm:
      valuesObject:
        # The chart would otherwise name everything
        # 'blackbox-exporter-prometheus-blackbox-exporter'. Probes point at this name:
        #   blackbox-exporter.monitoring.svc:9115
        fullnameOverride: blackbox-exporter

        config:
          modules:
            # The only module needed so far. A plain HTTP(S) GET that passes on any 2xx
            # answer, following redirects. Probes that go through Traefik add a
            # 'hostname' parameter, which sets the Host header (see probes/homelab.yaml).
            http_2xx:
              prober: http
              timeout: 5s
              http:
                valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
                follow_redirects: true
                preferred_ip_protocol: "ip4"

        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

        # Also scrape the exporter's own metrics (config reloads, its own health).
        serviceMonitor:
          selfMonitor:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true