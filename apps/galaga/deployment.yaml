# Deployment tells k3s how to run the galaga container.
# It keeps a desired number of identical pods alive and replaces any that die.
#
# The image is built and published by the application repo, 'html-galaga' -- this repo never
# builds it. The only link between the two repos is the image tag below.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaga
  namespace: galaga
  labels:
    app.kubernetes.io/name: galaga
spec:
  # three replicas across a two-node cluster, so losing either node doesn't take
  # the game offline. no HorizontalPodAutoscaler, for now.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: galaga # this Deployment manages pods with this label
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galaga # every pod gets the label here
    spec:
      # spread the three replicas over the two nodes when possible, but don't block scheduling if only one node is available (ScheduleAnyway).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: galaga
      containers:
        - name: galaga
          # Pin a real tag on every release. Never :latest -- a moving tag means
          # git no longer describes what's running, which defeats GitOps.
          image: ghcr.io/richieinthecloud/html-galaga:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            # deliberately tiny -- a static-file web server.
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
