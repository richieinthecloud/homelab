# Ingress is how traffic actually gets *into* the cluster.
#
# Without this, nothing outside the cluster can reach galaga: 
# the Service is ClusterIP-only, and k3s's bundled Traefik is already holding ports 80/443 on the nodes. 
# Traefik reads Ingress objects and routes by hostname, so this is the intended door.
#


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: galaga
  namespace: galaga
  labels:
    app.kubernetes.io/name: galaga
  annotations:
    # Puts galaga on the homepage dashboard (apps/homepage), which reads these
    # straight off the Ingress. Homepage finds the pods behind it by the label
    # app.kubernetes.io/name=<Ingress name>, which is 'galaga' for both here, so
    # the status dot works with no extra annotation. With three replicas the dot
    # reads 'partial' while some of them are down.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Galaga
    gethomepage.dev/group: Games # matches the layout in apps/homepage/config/settings.yaml
    gethomepage.dev/icon: mdi-space-invaders # Material Design Icons; there's no galaga.png
    gethomepage.dev/description: HTML5 Galaga clone
spec:
  ingressClassName: traefik # the IngressClass k3s installs by default
  rules:
    - host: galaga.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: galaga
                port:
                  name: http