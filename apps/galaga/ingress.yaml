# Ingress is how traffic actually gets *into* the cluster.
#
# Without this, nothing outside the cluster can reach galaga: 
# the Service is ClusterIP-only, and k3s's bundled Traefik is already holding ports 80/443 on the nodes. 
# Traefik reads Ingress objects and routes by hostname, so this is the intended door.
#


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: galaga
  namespace: galaga
  labels:
    app.kubernetes.io/name: galaga
spec:
  ingressClassName: traefik # the IngressClass k3s installs by default
  rules:
    - host: galaga.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: galaga
                port:
                  name: http