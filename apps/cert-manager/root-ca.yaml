# The homelab's own certificate authority.

# A CA needs a certificate before it can sign anything, so the very first one
# has to sign itself: the 'selfsigned' issuer below exists only to create the
# root. After that, 'homelab-ca' signs everything else with the root's key.

# 1. Bootstrap issuer. Signs a certificate with that certificate's own key.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# 2. The root certificate. Its public half (ca.crt) is what you install on each
# device; its private key never leaves the Secret below.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-root-ca
  namespace: cert-manager # a ClusterIssuer reads its CA Secret from this namespace
spec:
  isCA: true
  commonName: Homelab Root CA # the name your browser shows as "issued by"
  secretName: homelab-root-ca
  duration: 87600h # 10 years. Re-trusting every device is the cost of a new root, so make it rare.
  privateKey:
    algorithm: ECDSA
    size: 256
    # Keep the same key when cert-manager renews the root (at 2/3 of its life,
    # ~6.7 years). A new key would be a new root to install everywhere.
    rotationPolicy: Never
  # Limits what this root may ever vouch for: homelab.local and its subdomains,
  # nothing else. Your devices will trust this CA, so if its key ever leaked,
  # this is what stops it from minting a working certificate for your bank.
  # critical: browsers that don't understand the limit must reject it, not ignore it.
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        - homelab.local
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# 3. The issuer everything else uses: signs with the root above.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
spec:
  ca:
    secretName: homelab-root-ca