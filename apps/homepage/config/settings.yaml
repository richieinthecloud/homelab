# After an edit, ArgoCD rolls the pod (see kustomization.yaml). If the page still
# looks old, click the refresh icon at the bottom right: it clears homepage's
# cached page data.

title: Homelab
description: k3s homelab dashboard

headerStyle: boxed

# A green dot per service instead of the raw response time / pod status text.
statusStyle: dot

# Group order on the page. Only list groups that have something in them: a group
# named here with no services still gets an empty heading. Each phase adds its
# groups as it adds their services (Games when galaga is annotated, ...).
#
# Service and bookmark groups must not share a name, or one hides the other --
# hence "Links" for the bookmarks.
layout:
  Cluster:
    style: row
    columns: 3
  Links:
    style: row
    columns: 4
